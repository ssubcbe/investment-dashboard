<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Financial Investment Personal Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: sticky header + tab bar; one centred column (max 1180px); two region panels side by side, stacking on phones.
   Tokens copied from the Thought Board so both apps feel like one family. */
:root {
  --bg: #F5F4EF; --surface: #FFFFFF; --surface-2: #FAF9F5;
  --ink: #17181C; --muted: #6A6B73; --line: #E4E2DA; --line-strong: #CFCCC2;
  --accent: #2E5E4E; --accent-ink: #FFFFFF; --accent-soft: #E4EEE9;
  --red: #A8431A; --red-soft: #F7E7DD;
  --amber: #8E6410; --amber-soft: #F5EDD8;
  --blue: #355F80; --blue-soft: #E2EBF2;
  --gray-soft: #ECEBE6; --danger: #B42318;
  --pos: #2E5E4E; --pos-soft: #E4EEE9; --neg: var(--red);
  --uk: #2E5E4E; --in: #2B5F92;
  --chart-fill: rgba(46,94,78,.10);
  --radius: 12px; --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(20,20,25,.05), 0 6px 20px rgba(20,20,25,.05);
  --shadow-lg: 0 10px 40px rgba(20,20,25,.18);
  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
/* India views: very light blue page tint (cards stay white) */
:root { --india-tint: #E9F1F9; }
:root.india { --bg: #EEF4FA; --surface-2: #F6F9FC; --line: #DCE6EF; --line-strong: #C5D3E0; --gray-soft: #E4ECF4; --accent: #2B5F92; --accent-ink: #FFFFFF; --accent-soft: #E1ECF7; --chart-fill: rgba(43,95,146,.10); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121315; --surface: #1B1C1F; --surface-2: #17181A; --ink: #ECECEE; --muted: #9A9BA3;
    --line: #2A2B30; --line-strong: #3A3B41;
    --accent: #7CC0A5; --accent-ink: #0F1A15; --accent-soft: #1E2E27; --pos: #7CC0A5; --pos-soft: #1E2E27; --uk: #7CC0A5; --in: #8EB9E3;
    --red: #F0A07C; --red-soft: #3A2318; --amber: #E5C06A; --amber-soft: #352A12;
    --blue: #93BBDB; --blue-soft: #1C2A36; --gray-soft: #26272B; --danger: #FF8A80;
    --chart-fill: rgba(124,192,165,.12);
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 10px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121315; --surface: #1B1C1F; --surface-2: #17181A; --ink: #ECECEE; --muted: #9A9BA3;
  --line: #2A2B30; --line-strong: #3A3B41;
  --accent: #7CC0A5; --accent-ink: #0F1A15; --accent-soft: #1E2E27; --pos: #7CC0A5; --pos-soft: #1E2E27; --uk: #7CC0A5; --in: #8EB9E3;
  --red: #F0A07C; --red-soft: #3A2318; --amber: #E5C06A; --amber-soft: #352A12;
  --blue: #93BBDB; --blue-soft: #1C2A36; --gray-soft: #26272B; --danger: #FF8A80;
  --chart-fill: rgba(124,192,165,.12);
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 10px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-direction: column; gap: 12px; padding-block: 14px 12px; }
.brand-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-size: 20px; }
.brand .sub { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 10px; align-items: flex-end; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 2px; margin: -2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab-group { display: flex; flex-direction: column; gap: 5px; flex: none; }
.glabel { display: flex; align-items: center; gap: 6px; padding-left: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.glabel .cur { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); font-size: 10px; letter-spacing: 0; color: var(--ink); }
.gtabs { display: flex; gap: 2px; padding: 4px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(20,20,25,.04); }
.tab { border: 0; background: none; height: 32px; padding: 0 13px; border-radius: 8px; color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
.tab:hover { color: var(--ink); background: var(--gray-soft); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.gsep { width: 1px; align-self: stretch; margin-top: 18px; background: var(--line); flex: none; }

main.wrap { padding-block: 20px 60px; display: flex; flex-direction: column; gap: 20px; }

/* Buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid transparent; background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.ghost:hover { border-color: var(--line-strong); background: var(--surface); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; }

.seg { display: inline-flex; background: var(--gray-soft); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; height: 30px; padding: 0 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 500; min-width: 0; }
.in { height: 38px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); padding: 0 10px; color: var(--ink); width: 100%; min-width: 0; }
textarea.in { height: auto; padding: 8px 10px; resize: vertical; }
.in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink); }
.check input { margin-top: 3px; accent-color: var(--accent); }

/* Banner */
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--amber-soft); color: var(--ink); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; }
.banner b { color: var(--amber); }
.banner .grow { flex: 1 1 260px; min-width: 0; }

/* Region panels */
.regions { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-head h2 { font-size: 16px; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hero-val { font-family: var(--font-display); font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.kpi { background: var(--surface-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .k { font-size: 11px; color: var(--muted); font-weight: 500; }
.kpi .v { font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.subline { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.subline b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

.acct-list { display: flex; flex-direction: column; }
.acct { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
.acct:first-child { border-top: 0; }
.acct .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.acct .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .val { font-variant-numeric: tabular-nums; text-align: right; }
.acct .pl { font-variant-numeric: tabular-nums; text-align: right; min-width: 74px; font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }

.chart-box { position: relative; height: 220px; }
.chart-box.tall { height: 280px; }
.chart-box.short { height: 190px; }
.seg.seg-wrap { flex-wrap: wrap; max-width: 100%; }
.xl-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .xl-steps { grid-template-columns: minmax(0, 1fr); } }
.xl-step { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); }
.xl-step > span { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 13px var(--font-display); flex: none; }
.xl-step b { display: block; font-weight: 600; }
.xl-step small { display: block; color: var(--muted); font-size: 12px; line-height: 1.45; margin: 2px 0 8px; }
.xl-list { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.55; max-height: 220px; overflow-y: auto; }
.xl-list.err li { color: var(--danger); }
.wk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 900px) { .wk-grid { grid-template-columns: minmax(0, 1fr); } }
.wk-card { min-width: 0; }
.wk-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.wk-head > div:first-child { flex: 1 1 auto; }
.wk-fig { flex: none; }
@media (max-width: 520px) { .wk-head { flex-wrap: wrap; } .wk-fig { align-items: flex-start; text-align: left; } }
.wk-head h3 { font-size: 16px; }
.wk-total .wk-head h3 { font-size: 18px; }
.wk-fig { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
.wk-fig b { font: 600 20px var(--font-display); }
.wk-table { max-height: 264px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.wk-table th { position: sticky; top: 0; z-index: 1; }
.wk-table td, .wk-table th { padding: 7px 8px; font-size: 12px; }
.wk-grid .wk-table td.d { white-space: nowrap; }
.wk-fb { display: block; font-size: 11px; color: var(--amber); }
.ni-look { margin: -4px 0 2px; padding: 7px 10px; border-radius: 8px; background: var(--gray-soft); color: var(--ink); line-height: 1.45; }
.ni-look.ok { background: var(--pos-soft); }
.ni-look.muted { color: var(--muted); }
/* Sign-in & cloud status */
body.auth-on > :not(#authView):not(.toast):not(script) { display: none !important; }
#authView { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); }
.auth-card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 28px 26px 22px; display: grid; gap: 14px; }
.auth-brand { text-align: center; display: grid; gap: 4px; margin-bottom: 4px; }
.auth-brand h1 { font: 600 19px var(--font-display); margin: 6px 0 0; }
.auth-brand p { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.auth-mark { width: 48px; height: 48px; margin: 0 auto; border-radius: 14px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 600 17px var(--font-display); letter-spacing: -.02em; }
.auth-h { font: 600 16px var(--font-display); margin: 4px 0 -8px; }
.auth-go { height: 42px; font-size: 14.5px; }
.auth-go.busy { opacity: .6; }
.auth-msg { font-size: 13px; padding: 9px 12px; border-radius: 8px; background: var(--red-soft); color: var(--red); }
.auth-msg.ok { background: var(--pos-soft); color: var(--pos); }
.auth-foot { margin: 2px 0 0; text-align: center; }
.auth-card .linkbtn { justify-self: center; }
.auth-loading { display: flex; gap: 10px; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; padding: 14px 0 6px; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ctry-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ctry-row .cloud-chip { margin-left: auto; }
.cloud-chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 12px; }
.cc-txt { display: grid; line-height: 1.2; }
.cc-who { font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-status { color: var(--muted); font-size: 11px; }
.cc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pos); flex: none; }
.cc-dot.pending, .cc-dot.saving { background: var(--amber); }
.cc-dot.error { background: var(--red); }
@media (max-width: 640px) { .cc-who { max-width: 110px; } }
/* ISA residual cash & contributions */
.allow-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; }
@media (max-width: 900px) { .allow-3 { grid-template-columns: 1fr; } }
.bar i.rc-prev, .legend i.rc-prev { background: var(--amber); }
.rc-line { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); color: var(--muted); }
.rc-line b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.rc-line.total { border-bottom: 0; border-top: 1.5px solid var(--line-strong); margin-top: 2px; padding-top: 6px; color: var(--ink); font-weight: 600; }
.rc-line.total b { font-weight: 700; }
.contrib { padding: 14px 0 6px; }
.contrib-title { text-align: center; font: 600 16px var(--font-display); margin: 0 0 10px; }
.ctable { width: 100%; }
.ctable th, .ctable td { white-space: nowrap; font-size: 12px; padding: 8px 5px; font-variant-numeric: tabular-nums; }
.ctable th { letter-spacing: .02em; }
.ctable th:first-child, .ctable td:first-child { padding-left: 14px; }
.ctable th:last-child, .ctable td:last-child { padding-right: 14px; }
.ctable td:first-child, .ctable th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.ctable tr.cur td { background: var(--accent-soft); }
.ctable tr.cur td:first-child { background: var(--accent-soft); }
.contrib-note { padding: 8px 14px 4px; }
.cash-line { font-size: 12.5px; padding: 8px 11px; border-radius: 8px; background: var(--gray-soft); color: var(--muted); display: grid; gap: 4px; }
.cash-line b { color: var(--ink); font-variant-numeric: tabular-nums; }
.cash-line .neg { color: var(--red); }
/* NRE / NRO switch */
.h-title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.nri-sw { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--accent-soft); }
.nri-sw button { border: 0; background: none; height: 30px; padding: 0 14px; border-radius: 999px; font: 600 13px var(--font-display); letter-spacing: .04em; color: var(--accent); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.nri-sw button span { font: 500 11px var(--font-body); opacity: .7; }
.nri-sw button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.nri-note { font-size: 13px; color: var(--muted); margin-top: -6px; }
.nri-note b { color: var(--accent); }
.nri-mini { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; justify-content: flex-end; align-self: flex-start; margin-top: -23px; }
.toolbar:has(.nri-mini) { align-items: flex-start; }
.toolbar:has(.nri-mini) .h-title { gap: 22px; }
.mb-card { width: 252px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 7px 11px 8px; display: grid; gap: 3px; cursor: pointer; text-align: left; color: var(--ink); box-shadow: var(--shadow); font: inherit; }
.mb-card:hover { border-color: var(--accent); }
.mb-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; }
.mb-head b { font: 600 12.5px var(--font-display); letter-spacing: .06em; color: var(--accent); }
.mb-card { text-transform: uppercase; }
.mb-row { letter-spacing: .04em; }
.mb-row { display: grid; grid-template-columns: 64px 1fr 62px; align-items: center; gap: 6px; font-size: 11px; }
.mb-l { color: var(--muted); }
.mb-track { height: 7px; background: var(--gray-soft); border-radius: 2px; overflow: hidden; }
.mb-track i { display: block; height: 100%; border-radius: 2px; }
.mb-track i.inv { background: var(--line-strong); }
.mb-track i.val { background: var(--accent); }
.mb-track i.gl { background: var(--pos); } .mb-track i.gl.neg { background: var(--red); }
.mb-v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
@media (max-width: 640px) { .nri-mini { width: 100%; margin-top: 0 !important; justify-content: stretch; } .mb-row { grid-template-columns: 58px 1fr 56px; font-size: 10px; letter-spacing: .02em; } .mb-card { flex: 1 1 160px; width: auto; } }
/* Filter bar & sortable headings */
.fbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.fsearch { position: relative; flex: 1 1 220px; max-width: 340px; min-width: 0; display: block; }
.fsearch svg { position: absolute; left: 11px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.fsearch input { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--ink); padding: 0 12px 0 33px; font-size: 13px; }
.fsearch input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
.fgroup { display: inline-flex; gap: 2px; padding: 3px; background: var(--gray-soft); border-radius: 999px; flex-wrap: wrap; }
.fgroup button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
.fgroup button:hover { color: var(--ink); }
.fgroup button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.fsel { height: 34px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--ink); padding: 0 12px; font-size: 12.5px; max-width: 220px; }
.fsel:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fdates { display: inline-flex; gap: 6px; align-items: center; }

/* Value every position on a date */

/* ISA / LISA cash and contributions.

/* AMC console: KYC, nominee and folio verification (India) */
const STALE_DAYS = 730;
function checkState(flag, date, days) {
  days = days || STALE_DAYS;
  if (flag === 'Y') { if (!date) return { c: 'warn', l: 'Add date' }; if (D.days(date, TODAY) > days) return { c: 'warn', l: days >= 730 ? 'Over 2 years ago' : 'Over a year ago' }; return { c: 'ok', l: '✓ Up to date' }; }
  if (flag === 'N') return { c: 'bad', l: '✕ Not done' };
  return { c: 'none', l: 'Not recorded' };
}
const worst = (...st) => st.find(x => x.c === 'bad') || st.find(x => x.c === 'warn') || st.find(x => x.c === 'none') || st[0];
const pill = st => `<span class="status ${st.c}">${st.l}</span>`;
function ynSelect(id, attrs, val) {
  return `<select class="in sm" id="${id}" ${attrs} aria-label="Yes or no"><option value="" ${!val ? 'selected' : ''}>—</option><option value="Y" ${val === 'Y' ? 'selected' : ''}>Yes</option><option value="N" ${val === 'N' ? 'selected' : ''}>No</option></select>`;
}
function dateInput(id, attrs, val, enabled) {
  return `<input class="in sm" type="date" id="${id}" ${attrs} value="${esc(val || '')}" max="${TODAY}" ${enabled ? '' : 'disabled'} aria-label="Last verified on">`;
}
function consoleData() {
  const snap = snapshot();
  const units = new Map();
  for (const r of snap.rows) if (isMF(r.ins)) units.set(r.instrumentId, (units.get(r.instrumentId) || 0) + r.units);
  const funds = S.instruments.filter(i => isMF(i) && (units.has(i.id) || i.folioId)).map(i => {
    const f = folioById(i.folioId);
    return { ins: i, folio: f, amc: (f && f.amc) || i.amc || '', units: units.get(i.id) || 0, st: checkState((i.folioCheck || {}).v, (i.folioCheck || {}).date) };
  }).sort((a, b) => (a.amc || '~').localeCompare(b.amc || '~') || ((a.folio || {}).number || '').localeCompare((b.folio || {}).number || '') || a.ins.name.localeCompare(b.ins.name));
  const names = [...new Set([...S.folios.map(f => f.amc), ...funds.map(x => x.amc)].filter(Boolean))].sort();
  const amcs = names.map(n => { const info = S.amcInfo[n] || {}; const k = checkState(info.kyc, info.kycDate, 730), nm = checkState(info.nominee, info.nomineeDate); return { name: n, info, k, nm, st: worst(k, nm) }; });
  return { funds, amcs };
}

/* Weekly history: one chart per UK account (plus total); India = Mutual funds and Stocks */
const WRANGES = [['1M', '1 month', 31], ['6M', '6 months', 183], ['2Y', '2 years', 731], ['MAX', 'Max', 0]];
function weeklyGroupsFor(region) {
  const inR = id => (accById(id) || {}).region === region;
  const total = { id: 'all', title: region === 'UK' ? 'All UK accounts' : 'All Indian investments', sub: 'Total', test: a => inR(a) };
  if (region === 'IN') return [total,
    { id: 'mf', title: 'Mutual funds', sub: 'All schemes across AMCs', test: (a, i) => inR(a) && isMF(insById(i)) },
    { id: 'st', title: 'Stocks', sub: 'NSE & BSE', test: (a, i) => inR(a) && (insById(i) || {}).type === 'Stock' }];
  const order = ['ISA', 'PPEN', 'LISA', 'CPEN', 'PB'], rank = t => { const k = order.indexOf(t); return k < 0 ? 99 : k; };
  return [total, ...S.accounts.filter(a => a.region === 'UK').sort((x, y) => rank(x.type) - rank(y.type))
    .map(a => ({ id: 'a-' + a.id, title: a.name, sub: a.provider || '', test: acc => acc === a.id }))];
}
let _wkCache = null;
function weeklyByGroup(region) {
  const key = region + '|' + S.transactions.length + '|' + JSON.stringify(S.transactions[S.transactions.length - 1] || '') + '|' + BOOK.size + '|' + S.accounts.length;
  if (_wkCache && _wkCache.key === key && _wkCache.book === BOOK) return _wkCache.data;
  const groups = weeklyGroupsFor(region), out = Object.fromEntries(groups.map(g => [g.id, []]));
  const txs = S.transactions.filter(t => (accById(t.accountId) || {}).region === region);
  if (txs.length) {
    const start = txs.reduce((m, t) => t.date < m ? t.date : m, txs[0].date), lastF = D.lastFridayOnOrBefore(TODAY);
    for (let f = D.firstFridayOnOrAfter(start); f <= lastF; f = D.add(f, 7)) {
      const rows = valuate(S, BOOK, runLedger(S, f), f).filter(r => r.region === region);
      for (const g of groups) {
        const gr = rows.filter(r => g.test(r.accountId, r.instrumentId)), t = totals(gr);
        if (!out[g.id].length && t.invested === 0 && t.value === 0) continue;
        const fb = gr.filter(r => r.units > 0 && r.priceDate && r.priceDate < f && !r.ins.fixedPrice).map(r => r.priceDate).sort()[0] || null;
        out[g.id].push({ date: f, invested: t.invested, value: t.value, pl: t.pl, plPct: t.plPct, fallback: fb });
      }
    }
  }
  _wkCache = { key, book: BOOK, data: { groups, series: out } };
  return _wkCache.data;
}
const wRange = () => WRANGES.find(r => r[0] === UI.weeklyRange) || WRANGES[2];
function clipTo(series, key) { const r = WRANGES.find(x => x[0] === key) || WRANGES[2]; if (!r[2]) return series; const cut = D.add(TODAY, -r[2]); return series.filter(x => x.date >= cut); }
function clipRange(series) { const r = wRange(); if (!r[2]) return series; const cut = D.add(TODAY, -r[2]); return series.filter(x => x.date >= cut); }
function viewWeekly() {
  const region = UI.weeklyRegion, ccy = REGIONS[region].ccy, { groups, series } = weeklyByGroup(region), rg = wRange();
  const card = g => {
    const all = series[g.id] || [], sr = clipRange(all), last = sr[sr.length - 1], first = sr[0];
    const since = all[0] ? fdate(all[0].date) : null;
    const growth = last && first && sr.length > 1 ? (last.value - first.value) - (last.invested - first.invested) : null;
    const rows = sr.slice().reverse();
    return `<section class="card pad wk-card${g.id === 'all' ? ' wk-total' : ''}" aria-label="Weekly history, ${esc(g.title)}">
      <div class="wk-head"><div style="min-width:0"><h3>${esc(g.title)}</h3><div class="small muted">${esc(g.sub)}${since ? (g.sub ? ' · ' : '') + 'history from ' + since : ''}</div></div>
        ${last ? `<div class="wk-fig"><b class="num">${money(last.value, ccy)}</b><span class="small ${cls(last.pl)}">${signed(last.pl, ccy)} (${pct(last.plPct)})</span>${growth != null ? `<span class="small muted">Market move over ${rg[1].toLowerCase()}: <b class="${cls(growth)}" style="font-weight:600">${signed(growth, ccy)}</b></span>` : ''}</div>` : ''}</div>
      ${sr.length ? `<div class="chart-box${g.id === 'all' ? ' tall' : ''}"><canvas id="wk-${g.id}" role="img" aria-label="Weekly value and invested, ${esc(g.title)}"></canvas></div>
      <div class="wk-table"><table><thead><tr><th>Friday</th><th class="r">Invested</th><th class="r">Value</th><th class="r">P/L</th><th class="r">Change</th></tr></thead><tbody>
        ${rows.map((w, i) => { const prev = rows[i + 1] || all[all.indexOf(w) - 1]; const ch = prev ? (w.value - prev.value) - (w.invested - prev.invested) : null; return `<tr><td class="d">${g.id === 'all' ? fdate(w.date) : D.parse(w.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: '2-digit', timeZone: 'UTC' })}${w.fallback ? `<span class="wk-fb" title="Market closed on Friday; last close used">† ${fdate(w.fallback, true)}</span>` : ''}</td><td class="r">${money(w.invested, ccy)}</td><td class="r"><b>${money(w.value, ccy)}</b></td><td class="r ${cls(w.pl)}">${signed(w.pl, ccy)} <span class="small">(${pct(w.plPct)})</span></td><td class="r ${cls(ch)}">${ch == null ? '—' : signed(ch, ccy)}</td></tr>`; }).join('')}
      </tbody></table></div>` : `<div class="empty small">${all.length ? 'No weeks in this range.' : 'No history yet. It starts with the first purchase in this account.'}</div>`}
    </section>`;
  };
  return `<div class="toolbar"><h2>Weekly history</h2>
      <div class="seg" role="group" aria-label="Period">${WRANGES.map(([k, l]) => `<button data-wrange="${k}" aria-pressed="${rg[0] === k}" type="button">${k === 'MAX' ? 'Max' : k}</button>`).join('')}</div>${regionSeg('weeklyRegion')}</div>
    <div class="small muted">Closing values every Friday${rg[2] ? ' for the last ' + rg[1] : ' since your first purchase'}. When a market was shut on a Friday, that holding uses its last earlier close (marked †). Week change shows market movement only, so new money paid in doesn’t count as a gain.</div>
    <div class="wk-grid">${groups.slice(1).map(card).join('')}</div>`;
}
afterRender.weekly = () => {
  const region = UI.weeklyRegion, { groups, series } = weeklyByGroup(region);
  for (const g of groups) lineChart(document.getElementById('wk-' + g.id), clipRange(series[g.id] || []), REGIONS[region].ccy, { fit: true });
};

/* Allowances */
function viewAllowances() {

}

/* Transaction form */
/* Ticker / code → name lookup. Lists are published next to the page (lookup/*.json) and fetched only when needed:
   stocks.json = FTSE 100 + FTSE 250 + popular UK-listed ETFs, S&P 500, NSE equities; amfi.json = AMFI scheme codes (open schemes, NAV list of Aug 2026). */
const LOOKUP = {};
const loadLookup = k => LOOKUP[k] || (LOOKUP[k] = fetch(`lookup/${k}.json`, { cache: 'force-cache' }).then(r => r.ok ? r.json() : null).catch(() => null));
const amcToFund = a => a.replace(/\s*\(.*?\)\s*/g, ' ').replace(/\b(Asset Management|Asset Mgmt\.?|Investment Managers|Investment Management|Trustee|AMC|Fund Managers|Mutual Fund)\b.*$/i, '').replace(/\s+/g, ' ').trim() + ' Mutual Fund';
async function lookupCode(raw, region) {
  const t = String(raw || '').trim().toUpperCase(); if (!t) return null;
  const norm = x => String(x || '').toUpperCase().replace(/^AMFI\s*/, '').replace(/\.(L|LON|NS|BO)$/, '');
  const mine = S.instruments.find(i => i.region === region && !i.fixedPrice && i.ticker && norm(i.ticker) === norm(t));
  if (mine) return { existing: mine };
  if (region === 'IN') {
    if (/^(AMFI\s*)?\d{5,6}$/.test(t)) { const d = await loadLookup('amfi'); if (!d) return { offline: true }; const r = d.s[t.replace(/\D/g, '')]; return r ? { name: r[0], type: 'Mutual fund', amc: amcToFund(d.amcs[r[1]]), src: 'AMFI scheme list' } : { miss: 'AMFI code' }; }
    const d = await loadLookup('stocks'); if (!d) return { offline: true };
    const sym = t.replace(/\.(NS|BO)$/, ''), name = d.nse[sym];
    return name ? { name, type: 'Stock', exchange: /\.BO$/.test(t) ? 'BSE' : 'NSE', ticker: /\.(NS|BO)$/.test(t) ? t : sym + '.NS', src: 'NSE equity list' } : { miss: 'NSE symbol' };
  }
  if (/^[A-Z]{2}[A-Z0-9]{9}\d$/.test(t)) return { miss: 'ISIN', isin: true };
  const d = await loadLookup('stocks'); if (!d) return { offline: true };
  const k = t.replace(/\.(L|LON)$/, ''), lon = /\.(L|LON)$/.test(t);
  if (d.uk[k] && (lon || !d.us[k])) { const n = d.uk[k], fund = /UCITS ETF|\bETC\b/.test(n); return { name: n, type: fund ? 'ETF' : 'Stock', ccy: fund ? 'GBP' : 'GBX', ticker: k + '.L', src: fund ? 'UK-listed ETFs' : 'FTSE 100 / 250 list' }; }
  if (d.us[k] && !lon) return { name: d.us[k], type: 'Stock', ccy: 'USD', ticker: k, src: 'S&P 500 list' };
  return { miss: 'ticker' };
}

    if (type === 'TRANSFER') { const pos = runLedger(S, $('txDate').value || TODAY, editing && editing.id).get(acc.id + '|' + $('txInst').value); if (pos && pos.units > 0 && u > 0) txt = 'Moves ' + money(pos.cost / pos.units * Math.min(u, pos.units), ccy, 2) + ' of cost'; }
    $('txTotal').textContent = txt;
  };
  $('txType').addEventListener('click', e => { const b = e.target.closest('[data-type]'); if (!b) return; type = b.dataset.type; $('txType').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); $('txErr').textContent = ''; fill(); });
  const buildAcc = keep => { const list = S.accounts.filter(a => a.region === txRegion); $('txAcc').innerHTML = list.map(a => `<option value="${a.id}">${esc(accName(a))}</option>`).join(''); if (keep && list.some(a => a.id === keep)) $('txAcc').value = keep; };
  buildAcc(v.accountId);
  applyTint(txRegion === 'IN');
  $('txRegionSeg').addEventListener('click', e => { const b = e.target.closest('[data-txr]'); if (!b || b.dataset.txr === txRegion) return; txRegion = b.dataset.txr; applyTint(txRegion === 'IN'); $('txRegionSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); buildAcc(); $('txInst').value = ''; $('niPlat').value = ''; $('txErr').textContent = ''; $('txFx').value = ''; fill(); });
  ['txAcc', 'txDate', 'txInst', 'niType', 'niCcy', 'niFolio'].forEach(id => $(id).addEventListener('change', fill));
  ['txUnits', 'txPrice', 'txFees', 'txFx', 'txCash'].forEach(id => $(id).addEventListener('input', total));
  $('txDir').addEventListener('change', fill);
  if ($('txRep')) { $('txRep').addEventListener('change', fill); $('txRepUntil').addEventListener('change', total); }
  // Ticker or code → fill in the name (and type, exchange, currency, AMC) for a new investment
  let lookSeq = 0, lookTimer = 0;
  const look = async final => {
    const seq = ++lookSeq, raw = $('niTicker').value.trim(), region = accById($('txAcc').value).region, box = $('niLook');
    if (!raw) { box.hidden = true; if ($('niName').dataset.auto) { $('niName').value = ''; $('niName').dataset.auto = ''; } return; }
    const r = await lookupCode(raw, region); if (seq !== lookSeq || $('txInst').value !== '__new') return;
    box.hidden = false; box.className = 'ni-look small';
    if (!r) { box.hidden = true; return; }
    if (r.existing) { box.classList.add('ok'); box.innerHTML = `You already have <b>${esc(r.existing.name)}</b>. <button type="button" class="linkbtn small" id="niUse">Use it</button>`; $('niUse').onclick = () => { pinned.add(r.existing.id); wantInst = r.existing.id; $('niTicker').value = ''; box.hidden = true; fill(); }; return; }
    if (r.offline) { box.textContent = 'The name list couldn’t be loaded. Type the name instead.'; return; }
    if (r.miss) { box.classList.add('muted'); box.textContent = r.isin ? 'Fund ISINs aren’t in the built-in list. Type the fund name.' : final ? `This ${r.miss} isn’t in the built-in list. Check it, or type the name.` : ''; box.hidden = !box.textContent; if ($('niName').dataset.auto) { $('niName').value = ''; $('niName').dataset.auto = ''; } return; }
    const nm = $('niName');
    if (!nm.value.trim() || nm.dataset.auto) { nm.value = r.name; nm.dataset.auto = '1'; }
    if (r.type && INST_TYPES[region].includes(r.type) && $('niType').value !== r.type) $('niType').value = r.type;
    if (r.ccy && region === 'UK') $('niCcy').value = r.ccy;
    if (r.exchange) $('niEx').value = r.exchange;
    if (final && r.ticker && r.ticker !== $('niTicker').value.trim().toUpperCase()) $('niTicker').value = r.ticker;
    fill();
    if (r.amc) { const fs = S.folios.filter(f => f.amc.toLowerCase().split(' ')[0] === r.amc.toLowerCase().split(' ')[0]); if (!$('niFolio').value && fs.length === 1) $('niFolio').value = fs[0].id; if ($('niFolio').value === '__new' && !$('niAmc').value) $('niAmc').value = fs[0] ? fs[0].amc : r.amc; fill(); }
    box.classList.add('ok'); box.innerHTML = `✓ <b>${esc(r.name)}</b> <span class="muted">· from the ${r.src}${r.amc ? ' · ' + esc(r.amc) : ''}${r.ccy && region === 'UK' ? ' · priced in ' + (r.ccy === 'GBX' ? 'pence (GBX)' : r.ccy) : ''}</span>`;
  };
  $('niTicker').addEventListener('input', () => { clearTimeout(lookTimer); lookTimer = setTimeout(() => look(false), 300); });
  $('niTicker').addEventListener('change', () => { clearTimeout(lookTimer); look(true); });
  $('niName').addEventListener('input', () => { $('niName').dataset.auto = ''; });
  $('niFolio').addEventListener('change', () => { if ($('niFolio').value === '__new' && !$('niAmc').value) look(true); });
  $('txKind').addEventListener('change', () => { $('txKind').dataset.touched = '1'; });
  fill();
  $('txForm').addEventListener('submit', e => {
    e.preventDefault();
    const err = m => { $('txErr').textContent = m; };
    const acc = accById($('txAcc').value), region = acc.region, date = $('txDate').value;
    if (!date) return err('Choose the date of the transaction.');
    if (date > TODAY) return err('The date can’t be in the future.');
    if (type === 'CASH') {
      const amount = Math.round(+$('txCash').value * 100) / 100, out = $('txDir').value === 'OUT';
      if (!(amount > 0)) return err('Enter the amount paid in or taken out.');
      const base = { type: 'CASH', dir: out ? 'OUT' : 'IN', accountId: acc.id, instrumentId: '', amount, note: $('txNote').value.trim(), ...(out ? {} : { newMoney: $('txNew').checked }) };
      if (out && acc.type === 'ISA') { const b = cashAt(acc.id, date); if (amount > b + 0.005) return err(`Only ${money(b, 'GBP', 2)} cash was in this account on ${fdate(date)}.`); }
      const dates = !editing && !out && $('txRep') && $('txRep').checked ? repDates() : [date];
      if (!dates.length) return err('Choose a last payment date on or after the first one.');
      if (editing) S.transactions[S.transactions.indexOf(editing)] = { ...base, id: editing.id, seq: editing.seq, date };
      else dates.forEach((d, i) => S.transactions.push({ ...base, id: 't' + Date.now().toString(36) + i, seq: (S.seq = (S.seq || 0) + 1), date: d }));
      save(); closeModal(); render();
      return toast(editing ? 'Cash entry updated' : dates.length > 1 ? `${dates.length} monthly payments added` : out ? 'Withdrawal recorded' : 'Payment in recorded');
    }
    let instId = $('txInst').value;
    if (!instId) return err(type === 'BUY' ? 'Choose an investment, or add a new one.' : 'There is nothing held in this account on that date to ' + type.toLowerCase() + '.');
    let newIns = null, newFolio = null;
    if (instId === '__new') {
      const name = $('niName').value.trim(); if (!name) return err('Give the new investment a name.');
      const itype = $('niType').value, ticker = $('niTicker').value.trim().toUpperCase();
      if (region === 'IN' && itype === 'Stock' && ticker && !/\.(NS|BO)$/.test(ticker)) return err('Indian stock tickers end in .NS (NSE) or .BO (BSE), e.g. RELIANCE.NS.');
      newIns = { id: 'i' + Date.now().toString(36), region, type: itype, name, ticker: region === 'IN' && itype === 'Mutual fund' ? ticker.replace(/^AMFI\s*/, '') : ticker, ...(region === 'IN' ? { platform: $('niPlat').value.trim(), nri: $('niNri').value || nriDefault($('niPlat').value) } : {}), ccy: region === 'UK' ? $('niCcy').value : 'INR', prices: [], ...(region === 'IN' && itype === 'Stock' ? { exchange: $('niEx').value } : {}) };
      instId = newIns.id;
      if (region === 'IN' && itype === 'Mutual fund') {
        let fid = $('niFolio').value;
        if (fid === '__new') {
          const amc = $('niAmc').value.trim(), no = $('niFolioNo').value.trim();
          if (!amc || !no) return err('Enter the AMC and folio number, or choose “Not set yet”.');
          const ex = S.folios.find(f => f.amc.toLowerCase() === amc.toLowerCase() && f.number === no);
          if (ex) fid = ex.id; else { newFolio = { id: 'f' + Date.now().toString(36), amc, number: no, holder: '', notes: '' }; fid = newFolio.id; }
        }
        newIns.folioId = fid || '';
        newIns.amc = fid ? (newFolio && newFolio.id === fid ? newFolio.amc : folioById(fid).amc) : '';
      }
    }
    const ins = newIns || insById(instId);
    const ccy = REGIONS[region].ccy;
    const t = { id: editing ? editing.id : 't' + Date.now().toString(36), seq: editing ? editing.seq : (S.seq = (S.seq || 0) + 1), type, date, accountId: acc.id, instrumentId: instId, note: $('txNote').value.trim() };
    if (type === 'INCOME') { t.amount = +$('txAmount').value; t.kind = $('txKind').value; if (!(t.amount > 0)) return err('Enter the amount received.'); }
    else {
      t.units = +$('txUnits').value; if (!(t.units > 0)) return err(acc.type === 'PB' ? 'Enter the amount in pounds.' : 'Enter the number of units.');
      if (type !== 'TRANSFER') {
        t.price = acc.type === 'PB' ? 1 : +$('txPrice').value; if (!(t.price > 0)) return err('Enter the price per unit.');
        t.fees = +$('txFees').value || 0;
        t.fx = ins.ccy === ccy ? 1 : ins.ccy === 'GBX' ? 0.01 : (+$('txFx').value || 0);
        if (!(t.fx > 0)) return err('Enter the exchange rate.');
      }
      if (type === 'SELL' || type === 'TRANSFER') {
        const held = unitsHeld(S, acc.id, instId, date, editing && editing.id);
        if (t.units > held + 1e-6) return err(`You held ${fnum(held)} on ${fdate(date)}, so you can’t ${type === 'SELL' ? 'sell' : 'move'} ${fnum(t.units)}.`);
      }
      if (type === 'TRANSFER') t.toAccountId = $('txTo').value || '';
      if (type === 'BUY' && isIsaAcc(acc) && !isTracked(cashTracking(S), acc.id, date)) t.newMoney = $('txNew').checked;
    }
    if (newFolio) S.folios.push(newFolio);
    if (newIns) S.instruments.push(newIns);
    if (type === 'BUY' && !$('topUpL').hidden && $('txTopUp').checked && topUpAmt > 0) { const cashSeq = t.seq; t.seq = S.seq = (S.seq || 0) + 1; S.transactions.push({ id: 't' + Date.now().toString(36) + 'c', seq: cashSeq, type: 'CASH', dir: 'IN', accountId: acc.id, instrumentId: '', date, amount: Math.round(topUpAmt * 100) / 100, newMoney: true, note: 'Paid in for a purchase' }); }
    if (editing) S.transactions[S.transactions.indexOf(editing)] = t; else S.transactions.push(t);
    save(); closeModal(); render();
    toast(editing ? 'Transaction updated' : copyOf ? 'Copy added for ' + fdate(date) : { BUY: 'Purchase added', SELL: 'Sale recorded', TRANSFER: 'Transfer recorded', INCOME: (KINDS[t.kind] || 'Income') + ' added' }[type]);
  });
}

  ['transactions', r => r.id, 'id', r => ({ id: r.id })],
];
function stateToRows(st, uid) {
  const out = Object.fromEntries(DB_TABLES.map(([t]) => [t, []]));
  const isa = new Set(st.accounts.filter(a => a.type === 'ISA').map(a => a.id));
  out.profiles.push({ user_id: uid, fx_rates: (st.settings && st.settings.fx) || {}, allowances: (st.settings && st.settings.allowances) || {} });
  st.accounts.forEach((a, i) => out.accounts.push({ id: a.id, user_id: uid, region: a.region, type: a.type, name: a.name, provider: a.provider || '', sort_order: i }));
  for (const f of st.folios || []) {
    // folio check: the console stores it on each fund; use the latest one recorded for this folio
    const c = [f.check || {}, ...st.instruments.filter(i => i.folioId === f.id).map(i => i.folioCheck || {})].filter(x => x.v).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))[0] || {};
    out.folios.push({ id: f.id, user_id: uid, amc: f.amc, number: String(f.number), holder: f.holder || '', notes: f.notes || '', verified: yn(c.v), verified_on: nn(c.date) });
  }
  for (const [amc, v] of Object.entries(st.amcInfo || {})) if (amc) out.amc_checks.push({ user_id: uid, amc, kyc: yn(v.kyc), kyc_on: nn(v.kycDate), nominee: yn(v.nominee), nominee_on: nn(v.nomineeDate) });
  for (const i of st.instruments) {
    const IN = i.region === 'IN';
    out.instruments.push({ id: i.id, user_id: uid, region: i.region, type: i.type, name: i.name, ticker: IN && i.type === 'Mutual fund' ? String(i.ticker || '').replace(/^AMFI\s*/i, '') : (i.ticker || ''), ccy: i.ccy,
      fixed_price: nn(i.fixedPrice), exchange: IN && i.type === 'Stock' ? (i.exchange || 'NSE') : null, platform: IN ? (i.platform || '') : '', nri: IN ? (i.nri || nriOf(i) || null) : null,
      folio_id: IN && i.folioId ? i.folioId : null, amc: IN ? (i.amc || '') : '' });
    for (const [d, p] of i.prices || []) out.instrument_prices.push({ instrument_id: i.id, user_id: uid, price_date: d, close: p });
  }
  for (const d of st.declared || []) out.declared_dividends.push({ id: d.id, user_id: uid, instrument_id: d.instrumentId, ex_date: nn(d.exDate), pay_date: d.payDate, per_unit: d.perUnit, ccy: d.ccy });
  for (const t of st.transactions) {
    if (t.type === 'CASH' && !isa.has(t.accountId)) continue;   // Lifetime ISA cash isn't kept (not tracked)
    const trade = t.type === 'BUY' || t.type === 'SELL';
    out.transactions.push({ id: t.id, user_id: uid, account_id: t.accountId, instrument_id: t.type === 'CASH' ? null : t.instrumentId, type: t.type, trade_date: t.date, seq: Math.round(t.seq || 0),
      units: t.type === 'INCOME' || t.type === 'CASH' ? null : nn(t.units), price: trade ? nn(t.price) : null, fees: trade ? (+t.fees || 0) : 0, fx: trade ? (+t.fx || 1) : 1,
      amount: t.type === 'INCOME' || t.type === 'CASH' ? nn(t.amount) : null, income_kind: t.type === 'INCOME' ? (t.kind || 'OTHER') : null,
      to_account_id: t.type === 'TRANSFER' ? nn(t.toAccountId) : null,
      new_money: (t.type === 'BUY' || (t.type === 'CASH' && t.dir !== 'OUT')) && typeof t.newMoney === 'boolean' ? t.newMoney : null,
      cash_dir: t.type === 'CASH' ? (t.dir === 'OUT' ? 'OUT' : 'IN') : null, note: t.note || '' });
  }
  return out;
}
function rowsToState(r) {
  const prices = new Map(); for (const p of r.instrument_prices) { if (!prices.has(p.instrument_id)) prices.set(p.instrument_id, []); prices.get(p.instrument_id).push([p.price_date, +p.close]); }
  const folios = r.folios.map(f => ({ id: f.id, amc: f.amc, number: f.number, holder: f.holder || '', notes: f.notes || '', check: { v: f.verified || '', date: f.verified_on || '' } }));
  const fcheck = new Map(folios.map(f => [f.id, f.check]));
  const prof = r.profiles[0] || {};
  const st = {
    version: 1, sample: false,
    accounts: r.accounts.slice().sort((a, b) => a.sort_order - b.sort_order).map(a => ({ id: a.id, region: a.region, type: a.type, name: a.name, provider: a.provider || '' })),
    folios,
    amcInfo: Object.fromEntries(r.amc_checks.map(c => [c.amc, { kyc: c.kyc || '', kycDate: c.kyc_on || '', nominee: c.nominee || '', nomineeDate: c.nominee_on || '' }])),
    instruments: r.instruments.map(i => ({ id: i.id, region: i.region, type: i.type, name: i.name, ticker: i.ticker || '', ccy: i.ccy, prices: (prices.get(i.id) || []).sort((a, b) => a[0] < b[0] ? -1 : 1),
      ...(i.fixed_price != null ? { fixedPrice: +i.fixed_price } : {}), ...(i.exchange ? { exchange: i.exchange } : {}), ...(i.region === 'IN' ? { platform: i.platform || '', nri: i.nri || '' } : {}),
      ...(i.folio_id ? { folioId: i.folio_id, folioCheck: { ...fcheck.get(i.folio_id) } } : {}), ...(i.amc ? { amc: i.amc } : {}) })),
    declared: r.declared_dividends.map(d => ({ id: d.id, instrumentId: d.instrument_id, exDate: d.ex_date || '', payDate: d.pay_date, perUnit: +d.per_unit, ccy: d.ccy })),
    transactions: r.transactions.map(t => {
      const x = { id: t.id, seq: +t.seq, type: t.type, date: t.trade_date, accountId: t.account_id, instrumentId: t.instrument_id || '', note: t.note || '' };
      if (t.type === 'BUY' || t.type === 'SELL') Object.assign(x, { units: +t.units, price: +t.price, fees: +t.fees || 0, fx: +t.fx || 1 });
      if (t.type === 'TRANSFER') Object.assign(x, { units: +t.units, toAccountId: t.to_account_id || '' });
      if (t.type === 'INCOME') Object.assign(x, { amount: +t.amount, kind: t.income_kind });
      if (t.type === 'CASH') Object.assign(x, { amount: +t.amount, dir: t.cash_dir });
      if (t.new_money !== null && t.new_money !== undefined) x.newMoney = t.new_money;
      return x;
    }).sort(cmpTx),
    settings: { fx: prof.fx_rates || { USD: 0.75, EUR: 0.86 }, allowances: prof.allowances || { default: { isa: 20000, lisa: 4000 } } },
  };
  st.seq = st.transactions.reduce((m, t) => Math.max(m, t.seq || 0), 0);
  return st;
}
function snapshotOf(rows) { const m = new Map(); for (const [t, key] of DB_TABLES) m.set(t, new Map(rows[t].map(r => [key(r), JSON.stringify(r)]))); return m; }

/* ── Loading ── */
async function fetchAll(table, order) {
  const out = []; const size = 1000;
  for (let from = 0; ; from += size) {
    let q = cloud.sb.from(table).select('*').range(from, from + size - 1); if (order) q = q.order(order);
    const { data, error } = await q; if (error) throw error;
    out.push(...data); if (data.length < size) break;
  }
  return out;
}
async function loadCloud() {
  const names = DB_TABLES.map(([t]) => t);
  const res = await Promise.all(names.map(t => fetchAll(t, t === 'transactions' ? 'seq' : null)));
  const rows = Object.fromEntries(names.map((t, i) => [t, res[i]]));
  return rows;
}
async function loadMarket() {
  MARKET.clear();
  const keys = [...new Set(S.instruments.map(i => { const k = marketKey(i); return k ? k : null; }).filter(Boolean))]; if (!keys.length) return;
  const since = D.add(TODAY, -800), byKind = {};
  for (const k of keys) { const [kind, sym] = k.split('|'); (byKind[kind] = byKind[kind] || []).push(sym); }
  for (const [kind, syms] of Object.entries(byKind)) {
    for (let i = 0; i < syms.length; i += 100) {
      let from = 0;
      for (;;) {
        const { data, error } = await cloud.sb.from('market_prices').select('symbol_kind,symbol,price_date,close,ccy').eq('symbol_kind', kind).in('symbol', syms.slice(i, i + 100)).gte('price_date', since).order('price_date').range(from, from + 999);
        if (error) return;
        for (const p of data) {
          for (const ccy of ['GBP', 'GBX', 'USD', 'EUR', 'INR']) {
            let v = +p.close; if (p.ccy === ccy) {} else if (p.ccy === 'GBP' && ccy === 'GBX') v *= 100; else if (p.ccy === 'GBX' && ccy === 'GBP') v /= 100; else continue;
            const mk = `${p.symbol_kind}|${p.symbol}|${ccy}`; if (!MARKET.has(mk)) MARKET.set(mk, []); MARKET.get(mk).push([p.price_date, v]);
          }
        }
        if (data.length < 1000) break; from += 1000;
      }
    }
  }
}

/* ── Saving ── */
function setSync(state, err) { cloud.state = state; cloud.err = err || ''; paintCloudChip(); }
function scheduleSync() { if (!cloud.user || !cloud.ready) return; setSync('pending'); clearTimeout(cloud.timer); cloud.timer = setTimeout(syncNow, 700); }
async function syncNow() {
  if (!cloud.user) return;
  if (cloud.busy) { cloud.again = true; return; }
  cloud.busy = true; setSync('saving');
  try {
    const rows = stateToRows(S, cloud.user.id), now = snapshotOf(rows);
    // 1) add / change, parents first
    for (const [t, key, conflict] of DB_TABLES) {
      const prev = cloud.synced.get(t), changed = rows[t].filter(r => prev.get(key(r)) !== JSON.stringify(r));
      for (let i = 0; i < changed.length; i += 500) { const { error } = await cloud.sb.from(t).upsert(changed.slice(i, i + 500), { onConflict: conflict }); if (error) throw Object.assign(error, { table: t }); }
      for (const r of changed) prev.set(key(r), JSON.stringify(r));
    }
    // 2) remove what's gone, children first
    for (const [t, key, , filt] of DB_TABLES.slice().reverse()) {
      if (!filt) continue;
      const prev = cloud.synced.get(t), gone = [...prev.keys()].filter(k => !now.get(t).has(k));
      if (!gone.length) continue;
      if (t === 'instrument_prices' || t === 'amc_checks') { for (const k of gone) { const { error } = await cloud.sb.from(t).delete().match(filt(JSON.parse(prev.get(k)))); if (error) throw Object.assign(error, { table: t }); prev.delete(k); } }
      else for (let i = 0; i < gone.length; i += 200) { const ids = gone.slice(i, i + 200); const { error } = await cloud.sb.from(t).delete().in('id', ids); if (error) throw Object.assign(error, { table: t }); ids.forEach(k => prev.delete(k)); }
    }
    cloud.retry = 0; setSync('saved');
  } catch (e) {
    const msg = (e && (e.message || e.error_description)) || 'network error';
    setSync('error', msg); console.warn('Sync failed', e);
    if (!cloud.toasted) { toast('Couldn’t save to the cloud: ' + msg + '. Your change is kept on this page and will be retried.'); cloud.toasted = true; }
    clearTimeout(cloud.timer); cloud.timer = setTimeout(syncNow, Math.min(60000, 5000 * 2 ** cloud.retry++));
  } finally {
    cloud.busy = false;
    if (cloud.again) { cloud.again = false; syncNow(); }
  }
}
window.addEventListener('beforeunload', e => { if (CLOUD && cloud.user && (cloud.state === 'pending' || cloud.state === 'saving' || cloud.state === 'error')) { e.preventDefault(); e.returnValue = ''; } });

/* ── Header chip: who is signed in + save status ── */
function paintCloudChip() {
  const el = document.getElementById('cloudChip'); if (!el) return;
  el.hidden = !(CLOUD && cloud.user);
  if (el.hidden) return;
  const lab = { idle: 'Saved', saved: 'Saved', pending: 'Saving…', saving: 'Saving…', error: 'Not saved — retrying' }[cloud.state] || '';
  el.querySelector('.cc-dot').className = 'cc-dot ' + cloud.state;
  el.querySelector('.cc-status').textContent = lab;
  el.querySelector('.cc-status').title = cloud.err || '';
  el.querySelector('.cc-who').textContent = cloud.user.email || '';
}

/* ── Sign-in screens ── */
function authView(mode, msg) {
  let v = document.getElementById('authView');
  if (!v) { v = document.createElement('div'); v.id = 'authView'; document.body.appendChild(v); }
  document.body.classList.add('auth-on'); v.hidden = false;
  const head = `<div class="auth-brand"><div class="auth-mark" aria-hidden="true">£₹</div><h1>Financial Investment Personal Dashboard</h1><p>UK Equities · Indian Equities</p></div>`;
  const note = msg ? `<div class="auth-msg ${msg.ok ? 'ok' : ''}" role="status">${esc(msg.text)}</div>` : '';
  if (mode === 'loading') v.innerHTML = `<div class="auth-card">${head}<div class="auth-loading"><span class="spin" aria-hidden="true"></span>${esc((msg && msg.text) || 'Loading your portfolio…')}</div></div>`;
  if (mode === 'signin') v.innerHTML = `<form class="auth-card" id="authForm" novalidate>${head}${note}
      <label class="f">Email<input class="in" id="authEmail" type="email" autocomplete="username" required></label>
      <label class="f">Password<input class="in" id="authPw" type="password" autocomplete="current-password" required></label>
      <button class="btn primary auth-go" type="submit">Sign in</button>
      <button class="linkbtn small" type="button" id="authForgot">Forgot your password?</button>
      <p class="small muted auth-foot">Access is by invitation only. Use the link in your invitation email to set your password the first time.</p></form>`;
  if (mode === 'setpw') v.innerHTML = `<form class="auth-card" id="authForm" novalidate>${head}${note}
      <h2 class="auth-h">Choose your password</h2><p class="small muted">${esc(cloud.user ? cloud.user.email : '')}</p>
      <label class="f">New password<input class="in" id="authPw" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="f">Type it again<input class="in" id="authPw2" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="btn primary auth-go" type="submit">Save password and continue</button></form>`;
  if (mode === 'forgot') v.innerHTML = `<form class="auth-card" id="authForm" novalidate>${head}${note}
      <h2 class="auth-h">Reset your password</h2><p class="small muted">We’ll email you a link to choose a new one.</p>
      <label class="f">Email<input class="in" id="authEmail" type="email" autocomplete="username" required></label>
      <button class="btn primary auth-go" type="submit">Send reset link</button>
      <button class="linkbtn small" type="button" id="authBack">Back to sign in</button></form>`;
  const f = document.getElementById('authForm'); if (!f) return;
  const busy = on => { const b = f.querySelector('.auth-go'); b.disabled = on; b.classList.toggle('busy', on); };
  const fail = text => authView(mode, { text });
  const back = document.getElementById('authBack'); if (back) back.onclick = () => authView('signin');
  const fg = document.getElementById('authForgot'); if (fg) fg.onclick = () => authView('forgot');
  setTimeout(() => { const first = f.querySelector('input'); if (first) first.focus(); }, 30);
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (mode === 'signin') {
      const email = $id('authEmail').value.trim(), password = $id('authPw').value;
      if (!email || !password) return fail('Enter your email and password.');
      busy(true); const { data, error } = await cloud.sb.auth.signInWithPassword({ email, password });
      if (error) return fail(/invalid/i.test(error.message) ? 'That email and password don’t match. Try again, or reset your password.' : error.message);
      return startSession(data.session);
    }
    if (mode === 'forgot') {
      const email = $id('authEmail').value.trim(); if (!email) return fail('Enter your email.');
      busy(true); const { error } = await cloud.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      return authView('signin', error ? { text: error.message } : { ok: true, text: 'If that email has an account, a reset link is on its way. Open it on this device.' });
    }
    if (mode === 'setpw') {
      const a = $id('authPw').value, b = $id('authPw2').value;
      if (a.length < 8) return fail('Use at least 8 characters.');
      if (a !== b) return fail('The two passwords don’t match.');
      busy(true); const { error } = await cloud.sb.auth.updateUser({ password: a });
      if (error) return fail(error.message);
      toast('Password saved'); const { data } = await cloud.sb.auth.getSession(); return startSession(data.session);
    }
  });
}
function hideAuth() { const v = document.getElementById('authView'); if (v) v.hidden = true; document.body.classList.remove('auth-on'); }

async function startSession(session) {
  if (!session) return authView('signin');
  cloud.user = session.user; cloud.ready = false;
  authView('loading');
  try {
    const rows = await loadCloud();
    const empty = !rows.accounts.length && !rows.transactions.length && !rows.instruments.length;
    let local = null; try { const raw = localStorage.getItem(STORE_KEY); local = raw ? JSON.parse(raw) : null; } catch (e) {}
    let uploaded = null; try { uploaded = localStorage.getItem(STORE_KEY + '.uploaded'); } catch (e) {}
    UI.offerLocal = empty && !uploaded && local && !local.sample && Array.isArray(local.transactions) && local.transactions.length > 0 ? local.transactions.length : 0;
    cloud.synced = snapshotOf(Object.fromEntries(DB_TABLES.map(([t]) => [t, []])));
    if (empty) { S = emptyState(); S.settings = { ...S.settings }; }
    else { S = rowsToState(rows); cloud.synced = snapshotOf(stateToRows(S, cloud.user.id)); }
    ensureUuids(S);
    await loadMarket().catch(() => {});
    BOOK = buildBook(S, TODAY);
    cloud.ready = true; hideAuth(); paintCloudChip(); setSync('saved');
    if (empty) scheduleSync();   // creates the default accounts
    render();
    try { if (!localStorage.getItem(TOUR_KEY)) setTimeout(startTour, 700); } catch (e) {}
  } catch (e) {
    authView('signin', { text: 'Couldn’t load your data: ' + ((e && e.message) || 'network error') + '. Check your connection and sign in again.' });
    cloud.user = null;
  }
}
function loadSupabaseLib() {
  if (window.supabase && window.supabase.createClient) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js'; sc.onload = res; sc.onerror = () => rej(new Error('The sign-in library couldn’t be loaded.')); document.head.appendChild(sc); });
}
async function cloudBoot() {
  const hash = new URLSearchParams(location.hash.replace(/^#/, '')), linkType = hash.get('type'), linkErr = hash.get('error_description');
  authView('loading', { text: 'Connecting…' });
  try { await loadSupabaseLib(); } catch (e) { return authView('signin', { text: e.message }); }
  cloud.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit', storageKey: 'fipd-auth' } });
  cloud.sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { cloud.user = session && session.user; authView('setpw'); }
    if (ev === 'SIGNED_OUT') { cloud.user = null; cloud.ready = false; paintCloudChip(); authView('signin'); }
  });
  const { data } = await cloud.sb.auth.getSession();
  if (linkType || linkErr) history.replaceState(null, '', location.pathname + location.search);
  if (linkErr) return authView('signin', { text: /expired|invalid/i.test(linkErr) ? 'That link has expired or was already used. Ask for a new invitation, or use “Forgot your password?”.' : linkErr.replace(/\+/g, ' ') });
  if (data.session && (linkType === 'invite' || linkType === 'recovery')) { cloud.user = data.session.user; return authView('setpw'); }
  if (data.session) return startSession(data.session);
  authView('signin');
}
async function cloudSignOut() {
  if (cloud.state === 'pending' || cloud.state === 'saving') { clearTimeout(cloud.timer); await syncNow(); }
  if (cloud.state === 'error' && !confirm('Some changes haven’t been saved yet. Sign out anyway?')) return;
  await cloud.sb.auth.signOut(); location.reload();
}

if (CLOUD) cloudBoot();
else {
  render();
  try { if (!localStorage.getItem(TOUR_KEY)) setTimeout(startTour, 700); } catch (e) {}
}
